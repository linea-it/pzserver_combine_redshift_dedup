name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  validate:
    name: Ruff and lightweight tests
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ hashFiles('environment.dev.yaml') }}
          restore-keys: |
            conda-${{ runner.os }}-

      - name: Create development environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: pipe_crd_dev
          environment-file: environment.dev.yaml
          miniforge-version: latest
          conda-solver: libmamba
          auto-activate-base: false
          use-only-tar-bz2: true

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Show environment
        run: |
          python --version
          conda info --envs

      - name: Run pre-commit validation
        env:
          # Branch protection is a local developer guard. CI must validate the
          # resulting commit after it has legitimately been merged into main.
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files
