# === Tiebreaking and deduplication configuration ===

tiebreaking_priority:
  - "z_flag_homogenized"          # Priority column 1: homogenized redshift quality flag (higher is better)
  - "instrument_type_homogenized" # Priority column 2: homogenized instrument type (e.g., s > g > p based on instrument_type_priority)

  # You may specify any column here as a tiebreaking criterion,
  # as long as:
  # - It exists in all catalogs being crossmatched.
  # - It is numeric (except for 'instrument_type_homogenized', which uses a string-to-priority mapping).
  # - Higher values are considered better; lower values are worse.
  # Generic priority columns are normalized to float64 per catalog and must
  # contain at least one valid numeric value in every input catalog.
  # The columns will be evaluated in the order listed to resolve duplicates.
  # In deduplication modes, z_flag_homogenized is still created and preserved
  # for star classification (value 6), even when omitted from this ranking.

delta_z_threshold: 0.001    # Maximum allowed redshift difference (|z1 - z2|) to resolve hard ties
                             # Applied only when initial tiebreaking via columns results in a tie (tie_result == 2)

crossmatch_radius_arcsec: 0.5  # Angular radius (in arcseconds) used to perform spatial crossmatching.
margin_threshold_arcsec: 5.0   # HATS margin used by independent partition-local deduplication.
margin_warning_fraction: 0.8   # Warn when a boundary component spans this fraction of the margin.
validate_global_graph_edges: false  # Distributed edge/group consistency check (costs two joins).
validate_global_tie_invariants: true  # Fail on invalid winner/hard-tie patterns after label merge.
validate_crd_id_uniqueness: true  # Global nunique validation for every prepared input catalog.
repartition_prepared_catalogs: false  # Extra full-data pass to resize prepared partitions.
prepared_partition_size: "256MB"  # Used only when repartition_prepared_catalogs is enabled.

crossmatch_n_neighbors: 160     # Number of nearest neighbors to consider during crossmatching.
crossmatch_saturation_enabled: true  # Compute per-source saturation metrics and thresholds.
crossmatch_saturation_warn_fraction: 0.01  # Warn when >=1% of all source objects reach n_neighbors.
crossmatch_saturation_fail_fraction: 0.10  # Fail at >=10%; set null to disable failure.
crossmatch_geometry_diagnostics_enabled: false  # Separation/component-shape diagnostics over materialized matches.
representative_radius_diagnostics_enabled: false  # Component radius/extent diagnostics during and after deduplication.
dedup_edge_diagnostics_enabled: false  # Additional star-edge diagnostics while building the deduplication graph.

instrument_type_priority:
  s: 3     # Spectroscopic (most reliable type)
  g: 2     # Grism
  p: 1     # Photometric (least reliable)

# === Survey-specific translation rules for z_flag, instrument, and object type ===
# These are our internal definitions used to harmonize redshift quality and instrument types across surveys.
# The quality flag system is inspired by the VVDS survey but adapted to our needs:
#
# About the quality flag in our VVDS-inspired system:
# - 0: No redshift could be assigned
# - 1: Confidence < 70% (tentative redshift)
# - 2: 70% < Confidence < 90%
# - 3: 90% < Confidence < 99%
# - 4: Confidence > 99%
# - 6: Object identified as non-extragalactic (e.g., stars)

# Each block corresponds to a survey name and includes:
# - z_flag_translation: how to map original quality flags or based on conditions into a standardized quality scale (0-6)
# - instrument_type_translation: how to map original types into a standard label (s, g, p)
# - object_type_translation: how to map classifications into star, qso, agn,
#   or galaxy. `qso` requires an explicit QSO/quasar classification; `agn` is
#   used for generic AGN and BLAGN classifications without an explicit QSO label.
#   Its default is null; catalogs without object classifications are valid.
#   A rule may declare `source: <raw_column>` and `optional_source: true` to
#   discover a non-standard input column without a frontend columns mapping.
# You can mix value-based mappings and conditional rules (using Python expressions)
# Conditions are evaluated in YAML order. When multiple conditions match a row,
# the later condition takes precedence ("last match wins"). Conflicting matches
# emit a warning unless that translation declares `allow_condition_overlap: true`.
# z_flag and instrument translations accept `fast_path: auto|disabled|required`.
# `auto` is the default, `disabled` forces YAML rules, and `required` fails when
# the input is not compatible with the corresponding probability/s-g-p fast path.

save_expr_columns: false

expr_column_schema:
  z_best_s: float
  z_spec: float
  use_zgrism: float
  flag1: float
  flag2: float
  use_phot: float
  zspec_survey: str
  zspec: float
  z_flag: float
  ZCAT_PRIMARY: bool

translation_rules:

  2DFGRS:
    z_flag_translation:
      1: 0
      2: 1
      3: 3
      4: 4
      5: 4
    instrument_type_translation:
      default: "s"

  2DFLENS:
    object_type_translation:
      conditions:
        - expr: "z_flag == 6"
          value: "star"
      default: null
    z_flag_translation:
      1: 0
      2: 1
      3: 3
      4: 4
      6: 6
    instrument_type_translation:
      default: "s"

  2MRS:
    object_type_translation:
      conditions:
        # ZCAT type -9 combines QSO and generic AGN; both belong to the broader
        # AGN class, but the information is insufficient for the QSO subtype.
        - expr: "str(TYPE)[:2] == '-9'"
          value: "agn"
      default: "galaxy"
    z_flag_translation:
      conditions:
        - expr: "z_err == 0"
          value: 3
        - expr: "0 < z_err < 0.001"
          value: 4
        - expr: "z_err >= 0.001"
          value: 3
      default: 0
    instrument_type_translation:
      default: "s"

  3D-HST:
    object_type_translation:
      conditions:
        - expr: "z_best_s == 0"
          value: "star"
      default: null
    z_flag_translation:
      conditions:
        - expr: "z_best_s == 0"
          value: 6
        - expr: "z_best_s == 1 and z_spec != -1"
          value: 3
        - expr: "z_best_s == 2 and use_zgrism == 1 and flag1 == 0 and flag2 == 0"
          value: 3
        - expr: "z_best_s == 3 and use_phot == 1"
          value: 3
      default: 0
    instrument_type_translation:
      conditions:
        - expr: "z_best_s == 1"
          value: "s"
        - expr: "z_best_s == 2"
          value: "g"
        - expr: "z_best_s == 3"
          value: "p"
      default: "g"

  6DFGS:
    object_type_translation:
      conditions:
        - expr: "z_flag == 6"
          value: "star"
      default: null
    z_flag_translation:
      1: 0
      2: 1
      3: 3
      4: 4
      6: 6
    instrument_type_translation:
      default: "s"

  ASTRODEEP:
    z_flag_translation:
      conditions:
        - expr: "zspec_survey != '-'"
          value: 3
        - expr: "zspec_survey == '-'"
          value: 3
      default: 0
    instrument_type_translation:
      conditions:
        - expr: "zspec_survey != '-'"
          value: "s"
        - expr: "zspec_survey == '-'"
          value: "p"
      default: "p"

  ASTRODEEP-JWST:
    z_flag_translation:
      conditions:
        - expr: "zspec != -99 and z_flag < 400 and (len(str(int(z_flag))) <= 1 or int(str(int(z_flag))[-2]) <= 3)"
          value: 3
        - expr: "zspec == -99 and z_flag < 400 and (len(str(int(z_flag))) <= 1 or int(str(int(z_flag))[-2]) <= 3)"
          value: 3
      default: 0
    instrument_type_translation:
      conditions:
        - expr: "zspec != -99"
          value: "s"
        - expr: "zspec == -99"
          value: "p"
      default: "p"

  C3R2_DR3:
    z_flag_translation:
      4.0: 4
      3.5: 3
      3: 3
    instrument_type_translation:
      default: "s"

  COSMOS2020_CLASSIC:
    object_type_translation:
      conditions:
        - expr: "lp_type == 0"
          value: "galaxy"
        - expr: "lp_type == 1"
          value: "star"
      default: null
    z_flag_translation:
      allow_condition_overlap: true
      conditions:
        - expr: "lp_type == -9 or not np.isfinite(z)"
          value: 0
        - expr: "lp_type == 1"
          value: 6
        - expr: "(lp_type != 1 and lp_type != -9) and np.isfinite(z)"
          value: 1
        - expr: "(lp_type != 1 and lp_type != -9) and np.isfinite(z) and np.isfinite(lp_zPDF) and np.isfinite(lp_zMinChi2) and np.isfinite(lp_zPDF_l68) and np.isfinite(lp_zPDF_u68) and lp_zPDF_l68 <= z <= lp_zPDF_u68 and lp_zPDF_l68 <= lp_zPDF <= lp_zPDF_u68 and lp_zPDF_l68 <= lp_zMinChi2 <= lp_zPDF_u68"
          value: 2
        - expr: "(lp_type != 1 and lp_type != -9) and np.isfinite(lp_NbFilt) and lp_NbFilt > 30 and np.isfinite(z) and np.isfinite(lp_zPDF) and np.isfinite(lp_zMinChi2) and np.isfinite(lp_zPDF_l68) and np.isfinite(lp_zPDF_u68) and lp_zPDF_l68 <= z <= lp_zPDF_u68 and lp_zPDF_l68 <= lp_zPDF <= lp_zPDF_u68 and lp_zPDF_l68 <= lp_zMinChi2 <= lp_zPDF_u68"
          value: 3
      default: 0
    instrument_type_translation:
      default: "p"

  COSMOS_SRC:
    object_type_translation:
      conditions:
        - expr: "10 <= z_flag < 20"
          value: "agn"
      default: null
    z_flag_translation:
      conditions:
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 0"
          value: 0
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 1"
          value: 1
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 2"
          value: 2
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 3"
          value: 3
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 4"
          value: 4
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 9"
          value: 2
      default: 0
    instrument_type_translation:
      default: "s"

  COSMOS_Web:
    object_type_translation:
      conditions:
        - expr: "type == '0'"
          value: "galaxy"
        - expr: "type == '1'"
          value: "star"
        - expr: "type == '2'"
          value: "qso"
      default: null
    z_flag_translation:
      conditions:
        - expr: "type != '1' and z_flag != 0"
          value: 0
        - expr: "type != '1' and z_flag == 0 and np.abs(zpdf_med - zchi2) > 0.001"
          value: 1
        - expr: "type != '1' and z_flag == 0 and np.abs(zpdf_med - zchi2) <= 0.001 and nbfilt < 30"
          value: 2
        - expr: "type != '1' and z_flag == 0 and np.abs(zpdf_med - zchi2) <= 0.001 and nbfilt >= 30"
          value: 3
        - expr: "type == '1'"
          value: 6
      default: 0
    instrument_type_translation:
      default: "p"

  DEIMOS_10K:
    object_type_translation:
      allow_condition_overlap: true
      conditions:
        - expr: "10 <= z_flag < 20"
          value: "agn"
        - expr: "Remarks.str.strip().str.lower().isin(['star', 'm star'])"
          value: "star"
        - expr: "Remarks.str.contains(',star$', case=False, na=False, regex=True)"
          value: "star"
        - expr: "Remarks.str.contains('[(]QSO[)]|,QSO$', case=False, na=False, regex=True)"
          value: "qso"
      default: null
    z_flag_translation:
      conditions:
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 0"
          value: 0
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 1"
          value: 1
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 2"
          value: 2
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 3"
          value: 3
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 4"
          value: 4
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 9"
          value: 2
      default: 0
    instrument_type_translation:
      default: "s"

  DESI:
    object_type_translation:
      conditions:
        - expr: "SPECTYPE == 'STAR'"
          value: "star"
        - expr: "SPECTYPE == 'QSO'"
          value: "qso"
        - expr: "SPECTYPE == 'GALAXY'"
          value: "galaxy"
      default: null
    z_flag_translation:
      conditions:
        - expr: "SPECTYPE != 'STAR' and z_flag != 0 and ZCAT_PRIMARY != True"
          value: 0
        - expr: "SPECTYPE != 'STAR' and z_flag != 0 and ZCAT_PRIMARY == True"
          value: 1
        - expr: "SPECTYPE != 'STAR' and z_flag == 0 and ZCAT_PRIMARY == True and z_err >= 0.001"
          value: 3
        - expr: "SPECTYPE != 'STAR' and z_flag == 0 and ZCAT_PRIMARY == True and z_err < 0.001"
          value: 4
        - expr: "SPECTYPE == 'STAR'"
          value: 6
      default: 0
    instrument_type_translation:
      default: "s"

  DESI_DR1:
    object_type_translation:
      conditions:
        - expr: "SPECTYPE == 'STAR'"
          value: "star"
        - expr: "SPECTYPE == 'QSO'"
          value: "qso"
        - expr: "SPECTYPE == 'GALAXY'"
          value: "galaxy"
      default: null
    z_flag_translation:
      conditions:
        - expr: "SPECTYPE != 'STAR' and z_flag != 0 and ZCAT_PRIMARY != True"
          value: 0
        - expr: "SPECTYPE != 'STAR' and z_flag != 0 and ZCAT_PRIMARY == True"
          value: 1
        - expr: "SPECTYPE != 'STAR' and z_flag == 0 and ZCAT_PRIMARY == True and z_err >= 0.001"
          value: 3
        - expr: "SPECTYPE != 'STAR' and z_flag == 0 and ZCAT_PRIMARY == True and z_err < 0.001"
          value: 4
        - expr: "SPECTYPE == 'STAR'"
          value: 6
      default: 0
    instrument_type_translation:
      default: "s"

  DESI_DEEP_PILOT:
    object_type_translation:
      conditions:
        - expr: "SPECTYPE == 'STAR'"
          value: "star"
        - expr: "SPECTYPE == 'QSO'"
          value: "qso"
        - expr: "SPECTYPE == 'GALAXY'"
          value: "galaxy"
      default: null
    z_flag_translation:
      conditions:
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 0"
          value: 0
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 1"
          value: 1
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 2"
          value: 2
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 3"
          value: 3
        - expr: "np.trunc(float(z_flag)) - 10*np.trunc(np.trunc(float(z_flag))/10) == 4"
          value: 4
      default: 0
    instrument_type_translation:
      default: "s"

  ELAISS1OID:
    object_type_translation:
      conditions:
        - expr: "Class == 1"
          value: "agn"
        - expr: "Class == 5"
          value: "agn"
        - expr: "Class == 2 or Class == 3 or Class == 6"
          value: "galaxy"
        - expr: "Class == 4"
          value: "star"
      default: null
    z_flag_translation:
      0: 0
      1: 1
      2: 2
      3: 3
      4: 4
      6: 6
    instrument_type_translation:
      conditions:
        - expr: "zfinal_type == 's'"
          value: "s"
        - expr: "zfinal_type == 'p'"
          value: "p"
      default: "p"

  ELAISFBMC:
    object_type_translation:
      conditions:
        - expr: "tSp == 1 or tSp == 2 or tSp == 3"
          value: "galaxy"
        - expr: "tSp == 4 or tSp == 5 or tSp == 6 or tSp == 8"
          value: "agn"
        - expr: "tSp == 7"
          value: "star"
      default: null
    z_flag_translation:
      0: 0
      1: 1
      2: 2
      3: 3
      4: 4
      6: 6
    instrument_type_translation:
      conditions:
        - expr: "zbest_type == 's'"
          value: "s"
        - expr: "zbest_type == 'p'"
          value: "p"
      default: "p"

  ELG_FIGS:
    object_type_translation:
      default: "galaxy"
    z_flag_translation:
      default: 3
    instrument_type_translation:
      default: "s"

  EUCLID_Q1:
    # spe_class is discovered directly in the raw dataframe by the backend.
    # The current production catalog does not contain it, so its absence must
    # safely produce null output without requiring a frontend column mapping.
    object_type_translation:
      source: spe_class
      optional_source: true
      STAR: "star"
      GALAXY: "galaxy"
      QSO: "qso"
      UNDEF: null
      default: null
    z_flag_translation:
      conditions:
        - expr: "z_flag == 0.0"
          value: 0
        - expr: "0.0 < z_flag < 0.7"
          value: 1
        - expr: "0.7 <= z_flag < 0.9"
          value: 2
        - expr: "0.9 <= z_flag < 0.99"
          value: 3
        - expr: "z_flag >= 0.99"
          value: 4
      default: 0
    instrument_type_translation:
      default: "s"

  FMOS_COSMOS:
    object_type_translation:
      conditions:
        - expr: "z_flag == -1"
          value: "star"
      default: null
    z_flag_translation:
      -99: 0
      0: 0
      1: 1
      2: 2
      3: 3
      4: 4
      -1: 6
    instrument_type_translation:
      default: "s"

  GAMA_DR4:
    z_flag_translation:
      5: 4
      4: 4
      3: 3
      2: 2
      1: 1
    instrument_type_translation:
      default: "s"

  HELP-DMU23:
    object_type_translation:
      conditions:
        # The HELP flag combines QSO and AGN, so only the broader class is safe.
        - expr: "agn_flag == 1"
          value: "agn"
      default: null
    z_flag_translation:
      1: 0
      2: 1
      3: 3
      4: 4
      5: 4
    instrument_type_translation:
      default: "s"

  JADES:
    z_flag_translation:
      4: 4
      3: 3
      2: 2
      1: 1
      0: 0
    instrument_type_translation:
      default: "s"

  JADES_DR5_PHOTOZ:
    z_flag_translation:
      allow_condition_overlap: true
      conditions:
        - expr: "not np.isfinite(z) or not np.isfinite(z_ml) or not np.isfinite(chi_a) or not np.isfinite(nfilt) or nfilt <= 0"
          value: 0
        - expr: "np.isfinite(z) and np.isfinite(z_ml) and np.isfinite(chi_a) and np.isfinite(nfilt) and nfilt > 0"
          value: 1
        - expr: "np.isfinite(l95) and np.isfinite(u95) and np.isfinite(z_peak) and np.isfinite(z500) and l95 <= z_ml <= u95 and l95 <= z_peak <= u95 and l95 <= z500 <= u95"
          value: 2
        - expr: "np.isfinite(l68) and np.isfinite(u68) and np.isfinite(z_peak) and np.isfinite(z500) and l68 <= z_ml <= u68 and l68 <= z_peak <= u68 and l68 <= z500 <= u68"
          value: 3
      default: 0
    instrument_type_translation:
      default: "p"

  JADES_DR5_PHOTOZ_KRON:
    z_flag_translation:
      allow_condition_overlap: true
      conditions:
        - expr: "not np.isfinite(z) or not np.isfinite(z_ml) or not np.isfinite(chi_a) or not np.isfinite(nfilt) or nfilt <= 0"
          value: 0
        - expr: "np.isfinite(z) and np.isfinite(z_ml) and np.isfinite(chi_a) and np.isfinite(nfilt) and nfilt > 0"
          value: 1
        - expr: "np.isfinite(l95) and np.isfinite(u95) and np.isfinite(z_peak) and np.isfinite(z500) and l95 <= z_ml <= u95 and l95 <= z_peak <= u95 and l95 <= z500 <= u95"
          value: 2
        - expr: "np.isfinite(l68) and np.isfinite(u68) and np.isfinite(z_peak) and np.isfinite(z500) and l68 <= z_ml <= u68 and l68 <= z_peak <= u68 and l68 <= z500 <= u68"
          value: 3
      default: 0
    instrument_type_translation:
      default: "p"

  MOSDEF:
    z_flag_translation:
      7: 4
      6: 3
      5: 2
      4: 2
      3: 1
      2: 1
      1: 0
      0: 0
    instrument_type_translation:
      default: "s"

  OZDES:
    object_type_translation:
      allow_condition_overlap: true
      conditions:
        - expr: "Object_types.str.contains('Galaxy|LRG|ELG|SN_host|SN_free_host|RedMaGiC', case=False, na=False)"
          value: "galaxy"
        - expr: "Object_types.str.contains('AGN_reverberation|AGN_monitoring', case=False, na=False)"
          value: "agn"
        - expr: "Object_types.str.contains('QSO', case=False, na=False)"
          value: "qso"
        - expr: "Object_types.str.contains('BBstar|FStar|RNDstars|BrightStar|WhiteDwarf', case=False, na=False)"
          value: "star"
        - expr: "z_flag == 6"
          value: "star"
      default: null
    z_flag_translation:
      1: 0
      2: 1
      3: 3
      4: 4
      6: 6
    instrument_type_translation:
      default: "s"

  PRIMUS:
    object_type_translation:
      conditions:
        - expr: "CLASS == 'GALAXY'"
          value: "galaxy"
        - expr: "CLASS == 'STAR'"
          value: "star"
        - expr: "CLASS == 'AGN'"
          value: "agn"
      default: null
    z_flag_translation:
      -1: 0
      2: 1
      3: 2
      4: 3
    instrument_type_translation:
      default: "g"

  SDSS_DR17:
    object_type_translation:
      conditions:
        - expr: "CLASS == 'STAR'"
          value: "star"
        - expr: "CLASS == 'QSO'"
          value: "qso"
        - expr: "CLASS == 'GALAXY'"
          value: "galaxy"
      default: null
    z_flag_translation:
      conditions:
        - expr: "CLASS != 'STAR' and z_flag != 0 and SPECPRIMARY != 1"
          value: 0
        - expr: "CLASS != 'STAR' and z_flag != 0 and SPECPRIMARY == 1"
          value: 1
        - expr: "CLASS != 'STAR' and z_flag == 0 and SPECPRIMARY == 1 and z_err >= 0.001"
          value: 3
        - expr: "CLASS != 'STAR' and z_flag == 0 and SPECPRIMARY == 1 and z_err < 0.001"
          value: 4
        - expr: "CLASS == 'STAR'"
          value: 6
      default: 0
    instrument_type_translation:
      default: "s"

  SDSS_DR19:
    object_type_translation:
      conditions:
        - expr: "CLASS == 'STAR'"
          value: "star"
        - expr: "CLASS == 'QSO'"
          value: "qso"
        - expr: "CLASS == 'GALAXY'"
          value: "galaxy"
      default: null
    z_flag_translation:
      conditions:
        - expr: "CLASS != 'STAR' and z_flag != 0 and SPECPRIMARY != 1"
          value: 0
        - expr: "CLASS != 'STAR' and z_flag != 0 and SPECPRIMARY == 1"
          value: 1
        - expr: "CLASS != 'STAR' and z_flag == 0 and SPECPRIMARY == 1 and z_err >= 0.001"
          value: 3
        - expr: "CLASS != 'STAR' and z_flag == 0 and SPECPRIMARY == 1 and z_err < 0.001"
          value: 4
        - expr: "CLASS == 'STAR'"
